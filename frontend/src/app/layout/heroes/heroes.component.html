<section class="relative w-full h-screen overflow-hidden">
  <div class="absolute inset-0 z-[-1]">
    @for (video of backgroundVideos; track $index) {
      <ng-container>
        @if (currentVideoIndex === $index) {
          <ng-container>
            <video
              [@fadeAnimation]
              autoplay
              loop
              muted
              playsinline
              class="absolute top-0 left-0 w-full h-full object-cover"
              style="filter: blur(2px);">
              <source [src]="video.src" [type]="video.type" />
              <track kind="subtitles" label="English" srclang="en" [attr.src]="video.subtitles" default />
              <track kind="descriptions" label="Audio Descriptions" srclang="en" [attr.src]="video.descriptions" />
            </video>
          </ng-container>
        }
      </ng-container>
    }
  </div>
  <div class="absolute inset-0">
    <div class="absolute inset-0 bg-tropical-blue/50 z-20"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-tropical-blue/30 to-obsidian-black/20 z-10"></div>
    <div class="absolute inset-0 bg-[var(--color-base)] opacity-60 z-0"></div>
  </div>

  <div class="relative container w-[50%] px-8 h-full flex flex-col justify-center items-start text-white z-30">
    <div class="flex flex-col items-start">
      <h1 class="text-4xl sm:text-6xl md:text-7xl font-bold">
        Discover Cameroon Like Never Before
      </h1>
      <p class="mt-4 text-accent">From cultural wonders to hidden gems, your adventure starts here.</p>
    </div>
  </div>

  <div class="absolute bottom-50 left-0 w-full z-30">
    <div class="flex items-center w-full">
      <div class="flex items-center w-full size-0.5 bg-white/60 rounded-full relative">
        <button
          class="flex items-center space-x-4 pr-8 p-2 bg-white rounded-full z-10 ml-8 mr-8 cursor-pointer">
        <span class="border-2 border-accent p-2 rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </span>
          <span class="text-sm font-medium">Explore</span>
        </button>

        <div class="flex flex-grow justify-between items-center ml-40 pr-8">
          @for (steps of backgroundVideos; track $index) {
            <button
              (click)="activeStep = $index"
              [ngClass]="{
              'bg-tropical-blue': activeStep === $index,
              'bg-white': activeStep !== $index
            }"
              class="w-6 h-6 rounded-full border-2 cursor-pointer bg-accent border-white p-2 shadow-md transition-colors duration-300">
            </button>
          }
        </div>
      </div>
    </div>
  </div>

</section>
