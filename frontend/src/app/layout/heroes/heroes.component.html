<section class="relative w-full h-screen">
  <div class="fixed top-0 left-0 w-full h-full" style="z-index: -1;">
    <ng-container *ngFor="let video of backgroundVideos; let i = index">
      <video
        *ngIf="currentVideoIndex === i"
        [@fadeAnimation]
        class="absolute top-0 left-0 w-full h-full object-cover"
        autoplay
        muted
        loop
        playsinline
        style="filter: blur(3px);"
      >
        <source [src]="video.src" [type]="video.type">
        <img src="https://source.unsplash.com/random/1920x1080/?cameroon,landscape" [alt]="video.alt"
             class="w-full h-full object-cover">
      </video>
    </ng-container>
  </div>

  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute inset-0 bg-tropical-blue/50 z-20"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-tropical-blue/30 to-obsidian-black/20 z-10"></div>
    <div class="absolute inset-0 z-0" style="background-color: var(--color-base); opacity: 0.6;"></div>
  </div>

  <div class="relative container mx-auto px-4 h-full flex flex-col justify-center items-center text-center text-white">
    <h1 class="text-white font-bold text-4xl sm:text-6xl md:text-7xl">Discover Cameroon Like Never Before</h1>

    <p class="text mt-4">From cultural wonders to hidden gems—your adventure starts here.</p>

    <a href="#how-it-works"
       class="bg-tropical-blue text-white px-8 py-3 mt-6 rounded-full hover:bg-[#5A9BFD] transition shadow-md">
      Start Exploring
    </a>
  </div>

  <!-- Carousel Navigation Controls -->
  <div class="absolute bottom-24 left-0 right-0 flex justify-center items-center space-x-4 z-30">
    <button
      (click)="prevVideo()"
      class="bg-white/30 hover:bg-white/50 text-white rounded-full p-2 transition-all duration-300 focus:outline-none"
      aria-label="Previous video"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <!-- Carousel Indicators -->
    <div class="flex space-x-2">
      <ng-container *ngFor="let video of backgroundVideos; let i = index">
        <button
          (click)="goToVideo(i)"
          class="w-3 h-3 rounded-full transition-all duration-300 focus:outline-none"
          [ngClass]="{'bg-white': currentVideoIndex === i, 'bg-white/50 hover:bg-white/70': currentVideoIndex !== i}"
          [attr.aria-label]="'Go to video ' + (i + 1)"
        ></button>
      </ng-container>
    </div>

    <button
      (click)="nextVideo()"
      class="bg-white/30 hover:bg-white/50 text-white rounded-full p-2 transition-all duration-300 focus:outline-none"
      aria-label="Next video"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <div class="absolute bottom-8 left-0 right-0 text-center text-white">
    <a href="#how-it-works" class="inline-block text-white hover:text-tropical-blue transition">
      See how it works ↓
    </a>
  </div>
</section>
