<div
  class="search-container flex flex-col space-y-4 w-full max-w-md mx-auto p-4 bg-white rounded-lg shadow-md">
  <div class="relative">
    <app-input-field
      [type]="'text'"
      [placeholder]="placeholder"
      [formControl]="searchForm.controls.searchQuery"
      (input)="onSearch(searchForm.controls.searchQuery.value ?? '')" />
  </div>

  @if (loading$ | async) {
    <div class="loading-indicator text-center text-gray-500"> Loading... </div>
  }

  @if (error$ | async) {
    <div class="error-message text-red-500 text-center"> Error: ... </div>
  }

  <ul
    *ngIf="searchResults$ | async as results"
    class="results-list space-y-3 mt-4">
    <li *ngFor="let result of results" class="p-3 border-b">
      <p class="text-lg font-semibold">{{ result.name }}</p>
      <p class="text-sm text-gray-600">{{ result.location }}</p>
      <p class="text-xs text-gray-500">{{ result.description }}</p>
    </li>
  </ul>
</div>
